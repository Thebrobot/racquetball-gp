name: Sync R2 Brackets

# Automated sync is OFF (Ocala weekend complete). Results are maintained in-repo
# with match-result-overrides.json for any corrections.
#
# To pull fresh R2 data manually: Actions → Sync R2 Brackets → Run workflow.

on:
  workflow_dispatch: # manual trigger only

permissions:
  contents: write # needed to commit + push the results JSON

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (cached run)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run bracket sync
        run: node scripts/sync-r2-brackets.mjs

      - name: Check for changes
        id: diff
        if: always()
        run: |
          git diff --exit-code src/data/ocala-results.json public/data/live-activity.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit and push updated results
        if: always() && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ocala-results.json public/data/live-activity.json
          git commit -m "chore: sync R2 bracket results"
          git push
