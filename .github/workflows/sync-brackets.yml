name: Sync R2 Brackets

# Automated sync is ON for the Sarasota Open weekend (Jul 10–12, 2026).
# Runs every 10 minutes, scraping R2 brackets + refreshing GP points, and
# commits any changes (which triggers a site redeploy).
#
# The window guard below skips all scheduled syncs after Mon Jul 13 2026
# 06:00 UTC (Sunday midnight ET), so no data changes happen once the weekend
# is over — though the cron itself keeps ticking until this file is edited.
# Manual runs (Run workflow button) always work.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes

permissions:
  contents: write # needed to commit + push the results JSON

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check sync window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%Y%m%d%H)" -le 2026071306 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside Sarasota weekend window; skipping scheduled sync."
          fi

      - name: Checkout repo
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.window.outputs.run == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.window.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (cached run)
        if: steps.window.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run bracket sync
        if: steps.window.outputs.run == 'true'
        run: node scripts/sync-r2-brackets.mjs sarasota

      - name: Refresh GP points from Google Sheet
        if: steps.window.outputs.run == 'true'
        continue-on-error: true # points are secondary; never block a bracket commit
        run: npm run sync:points

      - name: Check for changes
        id: diff
        if: always() && steps.window.outputs.run == 'true'
        run: |
          git diff --exit-code src/data/ocala-results.json src/data/sarasota-results.json src/data/gp-points.json public/data/live-activity.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit and push updated results
        if: always() && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ocala-results.json src/data/sarasota-results.json src/data/gp-points.json public/data/live-activity.json
          git commit -m "chore: sync R2 bracket results"
          git push
