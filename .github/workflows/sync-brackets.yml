name: Sync R2 Brackets

# Fallback sync for the Port St. Lucie Open weekend (Oct 23–25, 2026).
# Primary live updates now come from Vercel Cron → /api/cron/sync-brackets
# (fetch + Vercel Blob, no redeploy). This workflow uses the same
# fetch + explicit-winner path (scripts/sync-r2-live.ts), refreshes GP
# points, and commits JSON so a missed Vercel run cannot leave the site
# stuck. It must not write heuristic winners.
#
# The window guard below skips all scheduled syncs after Mon Oct 26 2026
# 06:00 UTC (Sunday midnight ET + buffer). Manual runs always work.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes

permissions:
  contents: write # needed to commit + push the results JSON

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check sync window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%Y%m%d%H)" -le 2026102606 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside Port St. Lucie weekend window; skipping scheduled sync."
          fi

      - name: Checkout repo
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: npm ci

      - name: Run bracket sync
        if: steps.window.outputs.run == 'true'
        run: npx tsx scripts/sync-r2-live.ts psl

      - name: Refresh GP points from Google Sheet
        if: steps.window.outputs.run == 'true'
        continue-on-error: true # points are secondary; never block a bracket commit
        run: npm run sync:points

      - name: Check for changes
        id: diff
        if: always() && steps.window.outputs.run == 'true'
        run: |
          git diff --exit-code src/data/ocala-results.json src/data/sarasota-results.json src/data/port-st-lucie-results.json src/data/gp-points.json public/data/live-activity.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit and push updated results
        if: always() && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ocala-results.json src/data/sarasota-results.json src/data/port-st-lucie-results.json src/data/gp-points.json public/data/live-activity.json
          git commit -m "chore: sync R2 bracket results"
          git push
